<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset password — Watch & Earn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <span class="signal-mark" aria-hidden="true"><i></i><i></i><i></i></span>
      <span class="brand-name">Watch<em>&amp;</em>Earn</span>
    </div>
  </header>

  <section class="auth-wrap">
    <div class="card sim-card">
      <div class="sim-card-notch"></div>
      <h2 class="gate-title">Set a new password</h2>

      <div id="reset-loading">
        <p class="note">Verifying your reset link…</p>
      </div>

      <form id="reset-form" class="hidden">
        <label>New password
          <div class="password-field">
            <input type="password" id="reset-password" required minlength="8" placeholder="8+ characters">
            <button type="button" class="password-toggle" data-target="reset-password" aria-label="Show password">Show</button>
          </div>
        </label>
        <button type="submit" class="btn-primary">Update password</button>
      </form>

      <div id="reset-invalid" class="hidden">
        <p class="note">This reset link is invalid or has expired. Request a new one from the login page.</p>
        <a href="/" class="btn-ghost" style="display:inline-block;text-align:center;text-decoration:none;">Back to login</a>
      </div>

      <div id="reset-success" class="hidden">
        <p class="note">Your password has been updated.</p>
        <a href="/" class="btn-primary" style="display:inline-block;text-align:center;text-decoration:none;">Continue to log in</a>
      </div>

      <p id="reset-error" class="error"></p>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="/reset-password.js"></script>
</body>
</html>
